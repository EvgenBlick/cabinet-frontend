services:
  cabinet-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
        VITE_APP_NAME: ${VITE_APP_NAME:-Ultimteam VPN}
        VITE_APP_LOGO: ${VITE_APP_LOGO:-V}
    container_name: cabinet_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    env_file:
      - .env
    ports:
      - '127.0.0.1:3020:80'
    volumes:
      - ./dist_new:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bot_shared

networks:
  bot_shared:
    external: true
    name: remnawave_bot_bot_network
