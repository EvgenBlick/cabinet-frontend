<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const THEME_KEY = 'cabinet-theme';
          const ULTIMA_MODE_KEY = 'cabinet_ultima_mode';
          const ULTIMA_THEME_CONFIG_KEY = 'cabinet_ultima_theme_config';
          const storedTheme = localStorage.getItem(THEME_KEY);
          const prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          const theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#fef9f0' : '#0a0f1a');
          }

          const ultimaEnabled = localStorage.getItem(ULTIMA_MODE_KEY) === 'true';
          if (ultimaEnabled) {
            const ultimaRaw = localStorage.getItem(ULTIMA_THEME_CONFIG_KEY);
            let ultimaConfig = ultimaRaw ? JSON.parse(ultimaRaw) : null;
            const hasGreen = /1bd29f|00d285|1ed6bf|21d09a|10b981|0c2d2a|0c2528|0f3a38|92f4d8|49e9b3|b8ffec|emerald/i.test(ultimaRaw || '');
            if (!ultimaConfig || hasGreen) {
              ultimaConfig = {
                primaryColor: '#d4b37f',
                primaryTextColor: '#0a0c0f',
                secondaryColor: '#16181d',
                secondaryTextColor: '#f5f5f7',
                navBackgroundColor: '#101216',
                navActiveColor: '#d4b37f',
                navTextColor: '#d4b37f',
                backgroundTopColor: '#0a0c0f',
                backgroundBottomColor: '#040506',
                auraColor: '#b89358',
                ringColor: '#d4b37f',
                surfaceColor: '#121418',
                surfaceBorderColor: '#5a5040',
                scrollbarThumbColor: '#b89358',
                scrollbarTrackColor: '#101216',
                framesEnabled: false,
              };
              localStorage.setItem(ULTIMA_THEME_CONFIG_KEY, JSON.stringify(ultimaConfig));
            }
            if (ultimaConfig && typeof ultimaConfig === 'object') {
              const map = [
                ['primaryColor', '--ultima-color-primary'],
                ['primaryTextColor', '--ultima-color-primary-text'],
                ['secondaryColor', '--ultima-color-secondary'],
                ['secondaryTextColor', '--ultima-color-secondary-text'],
                ['navBackgroundColor', '--ultima-color-nav-bg'],
                ['navActiveColor', '--ultima-color-nav-active'],
                ['navTextColor', '--ultima-color-nav-text'],
                ['backgroundTopColor', '--ultima-color-bg-top'],
                ['backgroundBottomColor', '--ultima-color-bg-bottom'],
                ['auraColor', '--ultima-color-aura'],
                ['ringColor', '--ultima-color-ring'],
                ['surfaceColor', '--ultima-color-surface'],
                ['surfaceBorderColor', '--ultima-color-surface-border'],
                ['scrollbarThumbColor', '--ultima-color-scrollbar-thumb'],
                ['scrollbarTrackColor', '--ultima-color-scrollbar-track'],
              ];
              for (const [source, cssVar] of map) {
                const value = ultimaConfig[source];
                if (typeof value === 'string' && value.length > 0) {
                  document.documentElement.style.setProperty(cssVar, value);
                }
              }
              if (ultimaConfig.framesEnabled === true) {
                document.documentElement.classList.add('ultima-frames-enabled');
              }
              document.documentElement.classList.add('ultima-prepaint');
              if (meta && typeof ultimaConfig.backgroundTopColor === 'string') {
                meta.setAttribute('content', ultimaConfig.backgroundTopColor);
              }
            }
          }
        } catch {
          // Ignore prepaint failures and fall back to static theme.
        }
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    <style>
      html.dark body {
        background-color: #0a0f1a;
      }
      html.ultima-prepaint body {
        background: linear-gradient(
          165deg,
          color-mix(in srgb, var(--ultima-color-bg-top) 92%, #000) 0%,
          color-mix(in srgb, var(--ultima-color-bg-bottom) 95%, #000) 100%
        );
      }
      html.light body {
        background-color: #f7e7ce;
      }
      #root {
        visibility: hidden;
        opacity: 1;
      }
      html.app-content-mounted #root {
        visibility: visible;
      }
      #app-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 20000;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 1;
        transform: translateZ(0);
        transition: opacity 420ms cubic-bezier(0.22, 0.72, 0.22, 1);
        will-change: opacity;
      }
      html.dark #app-startup-overlay {
        background: radial-gradient(circle at 70% 45%, rgba(212, 179, 127, 0.15), #0a0c0f 60%);
      }
      html.light #app-startup-overlay {
        background: radial-gradient(circle at 70% 45%, rgba(212, 179, 127, 0.12), #f7e7ce 60%);
      }
      html.ultima-prepaint #app-startup-overlay {
        background: radial-gradient(
          circle at 70% 45%,
          color-mix(in srgb, var(--ultima-color-aura) 28%, transparent),
          color-mix(in srgb, var(--ultima-color-bg-top) 82%, #000) 60%
        );
      }
      html.app-ready #app-startup-overlay {
        opacity: 0;
      }
      .startup-loader-mark {
        position: relative;
        display: grid;
        width: 136px;
        height: 88px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 26px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.16);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 42px rgba(212, 179, 127, 0.2);
        backdrop-filter: blur(10px);
      }
      .startup-loader-mark::before {
        content: '';
        position: absolute;
        inset: -20px;
        border: 1px solid rgba(212, 179, 127, 0.18);
        border-radius: inherit;
        animation: startup-loader-pulse 1.8s ease-in-out infinite;
      }
      .startup-loader-core {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(212, 179, 127, 0.25);
        border-top-color: #d4b37f;
        border-radius: 999px;
        animation: startup-loader-spin 0.9s linear infinite;
        transition: opacity 180ms ease;
      }
      .startup-loader-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 10px;
        object-fit: contain;
        opacity: 0;
        transition: opacity 220ms ease;
      }
      .startup-loader-mark.has-brand-logo .startup-loader-core {
        opacity: 0;
      }
      .startup-loader-mark.has-brand-logo .startup-loader-image {
        opacity: 1;
      }
      @keyframes startup-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes startup-loader-pulse {
        0%,
        100% {
          opacity: 0.32;
          transform: scale(0.94);
        }
        50% {
          opacity: 0.82;
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader-mark::before,
        .startup-loader-core {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-startup-overlay" aria-hidden="true">
      <div class="startup-loader-mark">
        <span class="startup-loader-core"></span>
        <img id="app-startup-brand-image" class="startup-loader-image" alt="" />
      </div>
    </div>
    <script>
      (() => {
        try {
          const logoUrl = localStorage.getItem('cabinet_startup_logo_url');
          const image = document.getElementById('app-startup-brand-image');
          const mark = image && image.closest('.startup-loader-mark');
          if (!logoUrl || !image || !mark) return;
          image.addEventListener(
            'load',
            () => {
              if (image.naturalWidth > 0) {
                mark.classList.add('has-brand-logo');
                document.documentElement.classList.add('startup-logo-ready');
              }
            },
            { once: true },
          );
          image.src = logoUrl;
        } catch {
          // A neutral loader remains available when storage is unavailable.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
